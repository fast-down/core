[package]
name = "fast-down-api"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "A convenient and easy-to-use FFI wrapper for fast-down"
documentation = "https://docs.rs/fast-down-api"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["concurrency", "downloader", "parallel", "performance", "thread"]
categories = ["network-programming"]

[dependencies]
fast-down = { workspace = true, features = [
    "cookie-store",
    "fast-puller",
    "file",
    "getifaddrs",
    "mem",
    "reqwest-tls",
    "serde",
] }
parking_lot.workspace = true
tokio.workspace = true
tokio-util = "0.7"
url = { workspace = true, features = ["serde"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "brotli",
    "default-tls",
    "deflate",
    "gzip",
    "http2",
    "socks",
    "system-proxy",
    "zstd",
    "cookies",
] }
thiserror.workspace = true
crossfire.workspace = true
anyhow = "1.0.103"
mime_guess = "2.0.5"
path_helper = { version = "0.1.3", features = [
    "auto_ext",
    "sanitize",
    "tokio",
], path = "../../../../path_helper" }
chrono = "0.4.45"
urlencoding = "2.1.3"
soft-canonicalize = { version = "0.5.6", features = ["dunce"] }
inherit-config = "0.2.2"
toml = "1.1.2"

[dev-dependencies]
url = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"

[lints]
workspace = true
