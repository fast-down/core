name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # `rust-version` in Cargo.toml promises that 1.91 builds the crates; stable
  # is newer than that, so only this job can catch a newer API or a dependency
  # bump that silently raises the real minimum.
  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-msrv"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Check (all features)
        run: cargo check --workspace --all-features --locked
      - name: Check fast-steal (no_std, spin backend)
        run: cargo check -p fast-steal --no-default-features --features spin --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-nightly"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Run Clippy
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo hack clippy --all-targets --feature-powerset --exclude fast-steal --locked
      # `--at-least-one-of std,spin` filters the empty feature set for *every*
      # package, not just the one that needs a backend, so `fast-steal` runs on
      # its own and the rest of the workspace keeps the unfiltered powerset.
      - name: Run Clippy (fast-steal backends)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo hack clippy -p fast-steal --all-targets --feature-powerset --mutually-exclusive-features std,spin --at-least-one-of std,spin --locked

  test:
    name: Test (${{ matrix.os }} - ${{ matrix.channel }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        channel: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.channel }}
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.os }}-${{ matrix.channel }}"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Run Tests
        run: cargo hack test --feature-powerset --depth 1 --verbose --exclude fast-steal --locked
      - name: Run Tests (fast-steal backends)
        run: cargo hack test -p fast-steal --feature-powerset --depth 1 --verbose --mutually-exclusive-features std,spin --at-least-one-of std,spin --locked
      - name: Run Tests (all features)
        run: cargo test --all-features --verbose --locked

  bare-metal:
    name: No-std Build (thumbv7em-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Add bare-metal target
        run: rustup target add thumbv7em-none-eabi
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable-bare-metal"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      # A bare-metal target has no `std` to run a test harness on, so this job
      # only proves the `no_std` path compiles: `std` off, `spin` backend on.
      # It is a separate job so it can be dropped or pinned to nightly on its
      # own if the target ever needs it.
      - name: Build fast-steal (no_std, spin backend)
        run: cargo build -p fast-steal --no-default-features --features spin --target thumbv7em-none-eabi --locked

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run Deny
        run: cargo deny --locked --all-features check

  udeps:
    name: Unused Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-nightly"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-hack & cargo-udeps
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-udeps
      - name: Run Udeps
        run: cargo hack udeps --feature-powerset --exclude fast-steal --locked
      - name: Run Udeps (fast-steal backends)
        run: cargo hack udeps -p fast-steal --feature-powerset --mutually-exclusive-features std,spin --at-least-one-of std,spin --locked

  docs:
    name: Doc Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Run Doc Check
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo hack doc --feature-powerset --depth 1 --no-deps --exclude fast-steal --locked
      - name: Run Doc Check (fast-steal backends)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo hack doc -p fast-steal --feature-powerset --depth 1 --no-deps --mutually-exclusive-features std,spin --at-least-one-of std,spin --locked
      - name: Run Doc Check (all features)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --all-features --no-deps --locked

  # minimal-versions:
  #   name: Minimal Versions Check
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: dtolnay/rust-toolchain@nightly
  #     - uses: swatinem/rust-cache@v2
  #       with:
  #         shared-key: "ubuntu-nightly"
  #         add-job-id-key: "false"
  #         cache-on-failure: "true"
  #         cache-all-crates: "true"
  #         cache-workspace-crates: "true"
  #         save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
  #     - name: Install cargo-hack
  #       uses: taiki-e/install-action@v2
  #       with:
  #         tool: cargo-hack
  #     - name: Install cargo-minimal-versions
  #       uses: taiki-e/install-action@v2
  #       with:
  #         tool: cargo-minimal-versions
  #     - name: Check with minimal versions
  #       run: cargo hack minimal-versions check --feature-powerset

  semver-checks:
    name: Semver Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Run Semver Checks
        run: cargo semver-checks --all-features
