name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-nightly"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Run Clippy
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo hack clippy --all-targets --feature-powerset --mutually-exclusive-features std,spin --at-least-one-of std,spin

  test:
    name: Test (${{ matrix.os }} - ${{ matrix.channel }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        channel: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.channel }}
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.os }}-${{ matrix.channel }}"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Run Tests
        run: cargo hack test --feature-powerset --depth 1 --verbose --mutually-exclusive-features std,spin --at-least-one-of std,spin
      - name: Run Tests (all features)
        run: cargo test --all-features --verbose

  bare-metal:
    name: No-std Build (thumbv7em-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Add bare-metal target
        run: rustup target add thumbv7em-none-eabi
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable-bare-metal"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      # A bare-metal target has no `std` to run a test harness on, so this job
      # only proves the `no_std` path compiles: `std` off, `spin` backend on.
      # It is a separate job so it can be dropped or pinned to nightly on its
      # own if the target ever needs it.
      - name: Build fast-steal (no_std, spin backend)
        run: cargo build -p fast-steal --no-default-features --features spin --target thumbv7em-none-eabi

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run Deny
        run: cargo deny --all-features check

  udeps:
    name: Unused Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-nightly"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-hack & cargo-udeps
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-udeps
      - name: Run Udeps
        run: cargo hack udeps --feature-powerset --mutually-exclusive-features std,spin --at-least-one-of std,spin

  docs:
    name: Doc Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Run Doc Check
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo hack doc --feature-powerset --depth 1 --no-deps --mutually-exclusive-features std,spin --at-least-one-of std,spin
      - name: Run Doc Check (all features)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --all-features --no-deps

  # minimal-versions:
  #   name: Minimal Versions Check
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: dtolnay/rust-toolchain@nightly
  #     - uses: swatinem/rust-cache@v2
  #       with:
  #         shared-key: "ubuntu-nightly"
  #         add-job-id-key: "false"
  #         cache-on-failure: "true"
  #         cache-all-crates: "true"
  #         cache-workspace-crates: "true"
  #         save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
  #     - name: Install cargo-hack
  #       uses: taiki-e/install-action@v2
  #       with:
  #         tool: cargo-hack
  #     - name: Install cargo-minimal-versions
  #       uses: taiki-e/install-action@v2
  #       with:
  #         tool: cargo-minimal-versions
  #     - name: Check with minimal versions
  #       run: cargo hack minimal-versions check --feature-powerset

  semver-checks:
    name: Semver Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable"
          add-job-id-key: "false"
          cache-on-failure: "true"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Run Semver Checks
        run: cargo semver-checks --all-features
