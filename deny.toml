[advisories]
version = 2
# Unmaintained, not vulnerable: both crates work and have no drop-in successor
# here. `chrono` expands the `%`-strftime filename template, and `humantime`
# comes in through `humantime-serde` for `Duration` serialisation.
ignore = [
  "RUSTSEC-2026-0542", # humantime
  "RUSTSEC-2026-0543", # chrono
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "ISC",
  "OpenSSL",
  "CDLA-Permissive-2.0"
]
confidence-threshold = 1.0

[bans]
# We don't maintain a fixed Cargo.lock so enforcing
# `multiple-versions = "deny"` is impractical.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
